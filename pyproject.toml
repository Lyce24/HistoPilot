[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "histopilot"
version = "0.2.0"
description = "Interactive PFM–MIL workflows for computational pathology"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yancheng Liu" }]
keywords = ["computational pathology", "whole-slide images", "multiple-instance learning", "mcp"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
    "typer>=0.15,<1",
    "pyyaml>=6.0,<7",
    "openpyxl>=3.1,<4",
    "h5py>=3.12,<4",
    "numpy>=1.26,<3",
    "pyarrow>=17,<26",
    "regex>=2024.11",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.urls]
Homepage = "https://github.com/Lyce24/HistoPilot"
Documentation = "https://github.com/Lyce24/HistoPilot/tree/main/docs"
Changelog = "https://github.com/Lyce24/HistoPilot/blob/main/CHANGELOG.md"
Issues = "https://github.com/Lyce24/HistoPilot/issues"

[project.scripts]
histopilot = "histopilot.cli:app"

[project.optional-dependencies]
sdpc = ["opensdpc==2.0.0"]
imaging = [
    "pillow>=11,<13",
    "openslide-python>=1.4,<2",
    "openslide-bin>=4.0,<5",
]
training = [
    "torch>=2.10,<2.11",
    "lightning==2.6.1",
    "torchmetrics==1.8.2",
    "scikit-learn>=1.5,<2",
]
agent = [
    # 1.10 added tool titles and unstructured tool output, which the server uses.
    "mcp>=1.10,<2",
    "anyio>=4,<5",
]

[tool.uv.sources]
opensdpc = { git = "https://github.com/WonderLandxD/opensdpc", rev = "a07579eedde1dffddf8fa712ef236b97ca8cfc55" }

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
    "pytest-xdist>=3.6,<4",
    "pytest-cov>=6,<8",
    # Exact: each pyright release adds checks, so an upgrade is a deliberate change.
    "pyright==1.1.414",
]

[tool.setuptools.packages.find]
include = ["histopilot*"]
# resources/docs links to docs/, whose private, gitignored folders would otherwise be found
# as packages; package-data names the pages that ship.
exclude = ["histopilot.resources.docs", "histopilot.resources.docs.*"]

[tool.setuptools.package-data]
histopilot = [
    "py.typed",
    "resources/*.json",
    "resources/docs/user-guide.md",
    "resources/docs/methods.md",
    "resources/docs/cli-contract.md",
    "resources/docs/error-codes.md",
    "resources/docs/agents.md",
    "static/**/*",
    "static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "slow: trains real models or drives the real runner (5 s or more); deselect with -m 'not slow'",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "I", "UP",
    "B",    # bugbear: likely bugs and design problems
    "C4",   # comprehensions
    "DTZ",  # timezone-naive datetimes
    "ISC",  # implicit string concatenation, such as a missing comma in a list
    "LOG",  # logging misuse
    "PERF", # avoidable slow loops
    "PGH",  # blanket noqa and type-ignore comments
    "PIE",  # unnecessary code
    "PT",   # pytest style
    "RET",  # return statements
    "RUF",  # Ruff's own rules, including unused noqa comments
    "SIM",  # simplifications
    "T10",  # debugger breakpoints
]
ignore = [
    "ISC001",  # conflicts with ruff format, which joins such strings itself
    "PERF401", # findings and messages are appended check by check; the lists are small
    "PT006",   # the tests name several parametrize arguments in one string, as pytest allows
    "PT011",   # the tests check a raised error's code and fields after the block, not its text
    "PT018",   # pytest already reports which operand of `assert a and b` failed
    "RUF001",  # messages use typographic dashes and quotes on purpose
    "RUF002",  # docstrings do too
    "RUF003",  # and comments
    "RUF005",  # concatenation keeps groups of arguments apart where one unpacked literal would not
    "SIM102",  # a nested if keeps a long condition apart from the check it guards
    "SIM105",  # try/except/pass is the house style; contextlib.suppress hides the control flow
    "SIM114",  # separate branches name separate reasons for the same outcome
    "SIM117",  # nested with blocks show which body uses which resource
    "SIM300",  # tests put the module constant under test on the left, which it takes for yoda
]
# noqa comments that name these rules record a deliberate exception (a broad except that must
# never raise, an HTTP or query name); the rules stay off, and RUF100 keeps the comments.
external = ["BLE001", "N802", "N803"]

[tool.ruff.lint.per-file-ignores]
# Tests unpack a fixture or result whole, so its parts keep their names.
"tests/**" = ["RUF059"]
# unittest.TestCase modules use its assertions.
"tests/test_architecture.py" = ["PT009", "PT027"]
"tests/test_model_catalog_fixture.py" = ["PT009"]

[tool.ruff.lint.flake8-comprehensions]
# dict(key=value) reads as well as a literal; C408 still reports empty dict(), list() and tuple().
allow-dict-calls-with-keyword-arguments = true

[tool.ruff.lint.flake8-bugbear]
# Typer declares parameters through calls in their defaults.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.coverage.run]
# `pytest --cov` measures the package; scripts/coverage_summary.py reports it per subpackage.
source = ["histopilot"]

[tool.pyright]
# The service's core. Other packages are read only for the types the core imports from them.
include = ["histopilot/domain", "histopilot/application", "histopilot/api"]
# The oldest supported Python, on the platform HistoPilot runs on.
pythonVersion = "3.11"
pythonPlatform = "Linux"
# Most of the service predates annotations: strict mode's unknown-type, missing-annotation
# and type-argument rules would report every unannotated parameter (over 2,000), so the
# service is checked in standard mode plus the strict rules below, which hold today. Two
# strict rules stay off for good reasons: the unnecessary isinstance and comparison rules
# report the runtime checks that guard API boundaries, where annotations are not enforced,
# and tests/test_private_imports.py already ratchets private imports across modules.
typeCheckingMode = "standard"
# The domain package is fully annotated and checked in strict mode.
strict = ["histopilot/domain"]
reportDeprecated = "error"
reportMatchNotExhaustive = "error"
reportUnnecessaryCast = "error"
# An ignore that no longer suppresses anything is reported, so ignores cannot go stale.
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedClass = "error"
reportUnusedFunction = "error"
