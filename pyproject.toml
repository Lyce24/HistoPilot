[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "histopilot"
version = "0.1.0.dev0"
description = "Interactive PFM–MIL workflows for computational pathology"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
    "typer>=0.15,<1",
    "pyyaml>=6.0,<7",
    "openpyxl>=3.1,<4",
    "h5py>=3.12,<4",
    "regex>=2024.11",
]

classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
histopilot = "histopilot.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["histopilot*"]

[tool.setuptools.package-data]
histopilot = ["py.typed", "resources/*.json", "static/**/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
