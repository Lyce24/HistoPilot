name: Check and package
on:
  push:
  pull_request:
permissions:
  contents: read
# A newer push to the same branch or pull request supersedes its run. Each commit on main
# gets a group of its own, so main never cancels or skips one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # pyright runs on Node.js; pyproject.toml names the packages it checks.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install uv
      - run: uv sync --locked --extra imaging
      - run: uv run ruff check .
      - run: uv run pyright
      - name: Type coverage
        shell: bash
        run: uv run python scripts/type_coverage.py | tee -a "$GITHUB_STEP_SUMMARY"

  tests:
    name: Tests (${{ matrix.leg }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The service, the CLI and slide viewing install without ML packages: this leg
          # proves it, and runs the agent tools in their own environment.
          - leg: lean
            extras: --extra imaging
            label: without Torch
          # Torch and Lightning on CPU (PyPI's CUDA wheels run without a GPU): the models,
          # their parity with the reference implementations and real training workers.
          - leg: training
            extras: --extra imaging --extra training
            label: with Torch, on CPU
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Free disk space for Torch and its CUDA libraries
        if: matrix.leg == 'training'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /
      - run: python -m pip install uv
      - run: uv sync --locked ${{ matrix.extras }}
      - name: Torch is installed in the training leg only
        shell: bash
        run: |
          installed=$(uv run python -c 'import importlib.util as u; print(u.find_spec("torch") is not None)')
          expected=$([ "${{ matrix.leg }}" = training ] && echo True || echo False)
          echo "torch installed: $installed, expected: $expected"
          [ "$installed" = "$expected" ]
      - name: Tests, with coverage
        shell: bash
        run: |
          uv run pytest -n auto --dist worksteal --cov --cov-report= --junitxml=pytest.xml
          uv run python scripts/coverage_summary.py "${{ matrix.label }}" | tee -a "$GITHUB_STEP_SUMMARY"
      # Counts, skip reasons and reference-parity results; fails the training leg if a test
      # still skipped for want of Torch, Lightning or scikit-learn.
      - name: Test summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          uv run python scripts/ci_test_report.py pytest.xml --leg ${{ matrix.leg }} \
            --label "${{ matrix.label }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Agent tools with the agent extra
        if: matrix.leg == 'lean'
        run: |
          UV_PROJECT_ENVIRONMENT=.venv-agent uv sync --locked --extra agent
          .venv-agent/bin/python -m pytest tests/test_agent_tools.py tests/test_agent_evals.py

  package:
    name: Web, wheel and demo smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install uv
      - run: uv sync --locked --extra imaging
      - run: npm ci && npm test && npm run build
        working-directory: web
      - run: uv run python scripts/bundle_web.py
      - run: uv build --wheel
      - name: Verify packaged frontend
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile(next(Path('dist').glob('*.whl'))) as wheel:
              assert 'histopilot/static/index.html' in wheel.namelist()
              assert 'histopilot/resources/blca_demo_workspace.json' in wheel.namelist()
              # resources/docs links to docs/: only the MCP server's pages ship.
              docs = sorted(
                  name for name in wheel.namelist() if name.startswith('histopilot/resources/docs/')
              )
              pages = ['agents', 'cli-contract', 'error-codes', 'methods', 'user-guide']
              assert docs == [f'histopilot/resources/docs/{page}.md' for page in pages], docs
          PY
      # As a visitor gets it: the wheel alone in a fresh environment, no extras, serving the
      # public demo, checked from outside by scripts/smoke_demo.py.
      - name: Smoke-test the wheel's public demo
        shell: bash
        run: |
          wheel=$(ls dist/*.whl)
          version=$(basename "$wheel" | cut -d- -f2)
          uv venv "$RUNNER_TEMP/demo" --python 3.11
          uv pip install --python "$RUNNER_TEMP/demo/bin/python" "$wheel"
          "$RUNNER_TEMP/demo/bin/histopilot" serve --demo --port 8787 --no-browser > "$RUNNER_TEMP/demo.log" 2>&1 &
          server=$!
          status=0
          python scripts/smoke_demo.py http://127.0.0.1:8787 --expect-version "$version" || status=$?
          kill "$server"
          wait "$server" || true
          if [ "$status" -ne 0 ]; then cat "$RUNNER_TEMP/demo.log"; fi
          exit "$status"
      - uses: actions/upload-artifact@v4
        with:
          name: histopilot-wheel
          path: dist/*.whl

  e2e:
    name: Browser test of the demo
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install uv
      - uses: actions/download-artifact@v4
        with:
          name: histopilot-wheel
          path: dist
      - name: Install the wheel the package job built
        run: |
          uv venv "$RUNNER_TEMP/demo" --python 3.11
          uv pip install --python "$RUNNER_TEMP/demo/bin/python" dist/*.whl
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Walk the demo in Chromium
        working-directory: web
        env:
          HISTOPILOT_E2E_SERVER: ${{ runner.temp }}/demo/bin/histopilot serve --demo --port 8826 --no-browser
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14
