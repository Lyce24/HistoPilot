name: Container images
# Builds both images on every push and pull request and smoke-tests each one before anything is
# published: the CPU image must serve the public demo and pass scripts/smoke_demo.py; the CUDA
# image must import its training stack and run the CLI. Tags v* publish the tested image to
# GHCR, as do pushes to main (tag main), each also under an immutable sha-<commit> tag;
# nothing else is pushed.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: histopilot
            dockerfile: docker/Dockerfile
            description: HistoPilot service and browser UI (CPU)
            cache: type=gha,scope=histopilot
          # Torch and its CUDA libraries are several GB; the GitHub cache would evict
          # everything else, so this image builds without it.
          - image: histopilot-worker
            dockerfile: docker/Dockerfile.worker
            description: HistoPilot Task Center runner and CUDA compute workers
            cache: ''
    env:
      PUBLISH: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') }}
      # The smoke test runs this local tag; publishing retags exactly this image.
      TESTED: histopilot-smoke/${{ matrix.image }}:${{ github.sha }}
    steps:
      - name: Free disk space for the CUDA image
        if: matrix.image == 'histopilot-worker'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lyce24/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=MIT
      - name: Package version
        id: version
        run: |
          echo "value=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"
      - name: Build into the local image store
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ env.TESTED }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ matrix.cache }}
          cache-to: ${{ matrix.cache && format('{0},mode=max', matrix.cache) || '' }}
      # As compose.yaml's demo service and a public demo run it: demo mode on all interfaces.
      - name: Smoke-test the CPU image's public demo
        if: matrix.image == 'histopilot'
        shell: bash
        run: |
          docker run -d --init --name demo -p 127.0.0.1:7860:7860 "$TESTED" \
            serve --demo --host 0.0.0.0 --port 7860 --no-browser
          status=0
          python3 scripts/smoke_demo.py http://127.0.0.1:7860 \
            --expect-version "${{ steps.version.outputs.value }}" || status=$?
          docker logs demo
          docker rm --force demo
          exit "$status"
      - name: Smoke-test the CUDA image's training stack and CLI
        if: matrix.image == 'histopilot-worker'
        shell: bash
        run: |
          docker run --rm --entrypoint python "$TESTED" -c '
          import sys
          import histopilot, histopilot.training.module, lightning, sklearn, torch
          print("histopilot", histopilot.__version__, "torch", torch.__version__, "lightning", lightning.__version__)
          sys.exit(histopilot.__version__ != sys.argv[1])
          ' "${{ steps.version.outputs.value }}"
          docker run --rm "$TESTED" --help > /dev/null
          docker run --rm "$TESTED" runner --help > /dev/null
          echo "CLI and runner entry points start"
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        if: env.PUBLISH == 'true'
        shell: bash
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while read -r tag; do
            [ -n "$tag" ] || continue
            docker tag "$TESTED" "$tag"
            docker push "$tag"
          done <<< "$TAGS"
