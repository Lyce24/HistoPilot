name: Container images
# Builds both images on every push and pull request. Tags v* publish them to GHCR, as do
# pushes to main (tag main); nothing else is pushed.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: histopilot
            dockerfile: docker/Dockerfile
            description: HistoPilot service and browser UI (CPU)
            cache: type=gha,scope=histopilot
          # Torch and its CUDA libraries are several GB; the GitHub cache would evict
          # everything else, so this image builds without it.
          - image: histopilot-worker
            dockerfile: docker/Dockerfile.worker
            description: HistoPilot Task Center runner and CUDA compute workers
            cache: ''
    env:
      PUBLISH: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') }}
    steps:
      - name: Free disk space for the CUDA image
        if: matrix.image == 'histopilot-worker'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lyce24/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=MIT
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ matrix.cache }}
          cache-to: ${{ matrix.cache && format('{0},mode=max', matrix.cache) || '' }}
