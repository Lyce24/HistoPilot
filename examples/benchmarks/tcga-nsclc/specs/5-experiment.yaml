kind: experiment
specVersion: 1
name: MIL aggregators from scratch
notes: Five MIL aggregators trained from scratch on UNI2-h patch features with HistoPilot's
  default recipes, over the same five TCGA folds. The external CPTAC-NSCLC cohort
  is scored afterwards with each configuration's fold ensemble.
tags:
- public-study
- tcga-nsclc
predictorPolicy:
  method: ensemble
  refitPercentile: null
objectiveId: null
role: null
series: null
seriesMember: null
inputs:
  datasetId: '@nsclc-v1'
  targetSplitId: '@tcga-train-cptac-test'
  featureBundleId: '@bundle-tcga'
  loadingPolicy: auto
  packArtifactId: null
  trainingSplit:
    version: 4
    pools:
      source: rules
      trainSelection: remaining
      validationSource: training_fraction
      rules:
        train: []
        val: []
        test: []
    mode: kfold
    folds: 5
    seeds:
    - 42
    stratify: true
    validationFraction: 0.15
    testFraction: 0.2
    repeats: 5
    outerFolds: 5
    innerFolds: 3
    domainPolicy: all
    heldOutDomains: []
    heldOutSource: fractions
    ratios:
      train: 0.8
      val: 0.2
      test: 0
    rules:
      train: []
      val: []
      test: []
batches:
- id: aggregators
  version: 1
  mode: explicit
  configurations:
