    model: abmil
    embedDim: 512
    attentionDim: 384
    numFcLayers: 1
    gatedAttention: true
    dropout: 0.25
    inputDropout: 0.0
    gradientCheckpointing: false
    precision: 32-true
    gradientClipNorm: 0.0
    accumulateGradBatches: 1
    learningRate: 0.0003
    weightDecay: 0.0001
    maxEpochs: 40
    optimizer: adamw
    lrScheduler: none
    warmupEpochs: 0
    finalLrFraction: 0.01
    batchSize: 1
    bagSize: 4096
    earlyStopping: true
    patience: 8
    earlyStoppingMinDelta: 0.0
    minEpochs: 1
    checkpointMetric: validation_auroc
    analysis:
      version: 1
      confidenceLevel: 0.95
      bootstrapResamples: 2000
